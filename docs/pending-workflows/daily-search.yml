# Runs the daily job at 08:00 America/Chicago. Scheduled twice, 13:00 and
# 14:00 UTC, to cover both sides of US daylight saving time; the guard step
# only lets the real work through at the correct hour. Manual runs
# (workflow_dispatch) skip the guard.
name: Daily search

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

concurrency:
  group: internship-watch-job
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard - only run at 08:00 America/Chicago
        id: guard
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python -m job.schedule_guard

      - name: Install job dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: pip install -r job/requirements.txt

      - name: Cache Playwright browsers
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('job/requirements.txt') }}

      - name: Install Playwright's Chromium
        if: steps.guard.outputs.should_run == 'true'
        run: python -m playwright install --with-deps chromium

      # Node.js ships preinstalled on GitHub's ubuntu-latest runners; this
      # just adds the `claude` CLI the daily job's Claude agent steps
      # (job/agent/) shell out to. See CLAUDE.md: switching billing from
      # CLAUDE_CODE_OAUTH_TOKEN to ANTHROPIC_API_KEY is a single setting --
      # only whichever secret below is non-empty needs to be set.
      - name: Install Claude Code
        if: steps.guard.outputs.should_run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the daily job
        if: steps.guard.outputs.should_run == 'true'
        env:
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          # Set only one of these two -- whichever is set is what the
          # `claude` CLI authenticates with (see job/agent/client.py).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # For the daily improvement step's title-suggestion pull requests
          # (job/agent/titles_pr.py). The default Actions token, scoped by
          # the `permissions:` block above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Daily summary and alerts, sent to the Claude routine (research
          # preview; see job/agent/summary.py). Leave unset to skip it.
          CLAUDE_ROUTINE_URL: ${{ secrets.CLAUDE_ROUTINE_URL }}
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
        run: python -m job.run
