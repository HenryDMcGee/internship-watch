# Runs the daily job at 08:00 America/Chicago. Scheduled twice, 13:00 and
# 14:00 UTC, to cover both sides of US daylight saving time; the guard step
# only lets the real work through at the correct hour. Manual runs
# (workflow_dispatch) skip the guard.
name: Daily search

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

concurrency:
  group: internship-watch-job
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard - only run at 08:00 America/Chicago
        id: guard
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python -m job.schedule_guard

      - name: Install job dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: pip install -r job/requirements.txt

      - name: Cache Playwright browsers
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('job/requirements.txt') }}

      - name: Install Playwright's Chromium
        if: steps.guard.outputs.should_run == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Run the daily job
        if: steps.guard.outputs.should_run == 'true'
        env:
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: python -m job.run
